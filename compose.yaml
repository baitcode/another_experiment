services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comments
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: deno task migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/comments
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  http:
    build: .
    command: deno task dev:serve
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/comments
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./deno.json:/app/deno.json
      - ./deno.lock:/app/deno.lock
    depends_on:
      migrate:
        condition: service_completed_successfully

  sync:
    build: .
    command: deno task dev:sync
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/comments
    volumes:
      - ./src:/app/src
      - ./deno.json:/app/deno.json
      - ./deno.lock:/app/deno.lock
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dbdata:
